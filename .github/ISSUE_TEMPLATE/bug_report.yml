name: 不具合報告
description: バグの再現手順や期待される動作を提供してください。
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |-
        再現可能な不具合を報告します。対象環境、再現手順、期待した結果と実際の結果を整理してください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/web-page-enhancement-scripts/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/web-page-enhancement-scripts/blob/HEAD/SECURITY.md) を確認してください。
  - type: markdown
    attributes:
      value: '<!-- 重要: 可能であれば再現手順を最小化し、ブラウザ環境やバージョン情報を含めてください。 -->'
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の既存Issueを検索しました。
          required: true
        - label: READMEと関連する利用・更新手順を確認しました。
          required: true
  - type: textarea
    id: original-3
    attributes:
      label: 対象環境
      placeholder: |-
        - OS: (例: Windows 11)
        - ブラウザ: (例: Firefox 123.0)
        - スクリプト/バージョン: (可能であれば `dist/` のファイル名やコミットハッシュ)
        - その他: (Tampermonkey のバージョン等)
    validations:
      required: true
  - type: textarea
    id: original-1
    attributes:
      label: 概要
      placeholder: バグの短い説明を記載してください。
    validations:
      required: true
  - type: textarea
    id: original-2
    attributes:
      label: 再現手順
      placeholder: |-
        1. 何をしたか（例: ページを開いて、メニュー→クリック）
        2. 次に実行した操作
        3. 期待される結果
        4. 実際の結果
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual-result
    attributes:
      label: 実際の結果
      description: エラーは秘密情報だけを除いて記載してください。
    validations:
      required: true
  - type: textarea
    id: original-4
    attributes:
      label: 診断情報
      placeholder: 問題が視覚的に把握できる場合はスクリーンショット、コンソールログ、エラーメッセージを添付してください。
  - type: textarea
    id: original-5
    attributes:
      label: 補足
      placeholder: 任意の補足情報（発生頻度、回避方法の試行結果等）。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
